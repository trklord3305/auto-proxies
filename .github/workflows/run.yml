name: Run Proxy Updater

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run script
        run: python update.py
      - name: Commit and push
        run: |
          git config --global user.name 'Bot'
          git config --global user.email 'bot@bot.com'
          git add active_proxies.txt
          git commit -m "Update proxies" || exit 0
          git push
