name: Run Massive Proxy Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch and Clean Proxies
        run: |
          python3 -c "
          import urllib.request

          sources = [
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt',
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/https.txt',
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks4.txt',
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt',
              'https://api.proxyscrape.com/v4/free-proxy-list/get?proxy_format=text&format=text',
              'https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt',
              'https://raw.githubusercontent.com/clash-verge-rev/proxy-pool/main/proxy.txt',
              'https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt',
              'https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt',
              'https://raw.githubusercontent.com/mmpx12/proxy-list/master/http.txt',
              'https://raw.githubusercontent.com/mmpx12/proxy-list/master/socks5.txt'
          ]

          print('Fetching from massive sources...')
          proxies = set()
          for src in sources:
              try:
                  req = urllib.request.Request(src, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      for line in resp.read().decode('utf-8').splitlines():
                          c = line.strip()
                          if c and ':' in c and len(c) < 30:
                              proxies.add(c)
              except Exception as e:
                  print('Skip source error:', e)

          print(f'Total valid format proxies collected: {len(proxies)}')

          # حفظ النظيف والمرتب مباشرة لضمان السرعة الفائقة وعدم تعليق الجلسة
          with open('active_proxies.txt', 'w') as f:
              for p in list(proxies):
                  f.write(p + '\n')
          print('Successfully updated active_proxies.txt!')
          "

      - name: Push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add active_proxies.txt
          git commit -m "Auto update massive proxy list" || exit 0
          git push
