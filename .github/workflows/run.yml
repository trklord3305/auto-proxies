name: Run Instagram Proxy Updater

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات لتجنب حظر جهاز الفحص
  workflow_dispatch:

concurrency:
  group: instagram-proxy-updater
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install aiohttp

      - name: Download, Validate and Save Instagram Proxies
        run: |
          python3 - <<'PY'
          import asyncio, re, urllib.request
          import aiohttp

          # ---------- 1) المصادر ----------
          sources = [
              # مصادر مخصصة لإنستغرام (الأعلى جودة)
              'https://raw.githubusercontent.com/ClearProxy/checked-proxy-list/main/custom/instagram/http.txt',
              'https://raw.githubusercontent.com/ClearProxy/checked-proxy-list/main/custom/instagram/socks4.txt',

              # مصادر عامة ضخمة (للفحص الذاتي)
              'https://raw.githubusercontent.com/Mohammedcha/ProxRipper/main/full_proxies/http.txt',
              'https://raw.githubusercontent.com/Mohammedcha/ProxRipper/main/full_proxies/socks4.txt',
              'https://raw.githubusercontent.com/Mohammedcha/ProxRipper/main/full_proxies/socks5.txt',

              # Proxifly
              'https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/http/data.txt',
              'https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks4/data.txt',
              'https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks5/data.txt',

              # Monosans (احتياطي)
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt',
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/https.txt',
          ]

          pat = re.compile(r'^(\d{1,3}\.){3}\d{1,3}:\d{1,5}$')
          proxies = set()

          for src in sources:
              try:
                  req = urllib.request.Request(
                      src,
                      headers={'User-Agent': 'Mozilla/5.0'}
                  )
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read(20 * 1024 * 1024).decode('utf-8', 'ignore')
                      for line in data.splitlines():
                          c = line.strip()
                          if pat.match(c):
                              proxies.add(c)
                  print(f'OK: {src} | total now: {len(proxies)}')
              except Exception as e:
                  print('Skip:', src, e)

          print(f'Collected: {len(proxies)} proxies')

          # ---------- 2) الإعدادات ----------
          TEST_URL = 'https://www.instagram.com/'
          TIMEOUT = 10
          CONCURRENCY = 500
          MAX_VALID = 300   # توقف بعد جمع هذا العدد (عدّله كما تريد)

          # أكواد مقبولة = الاتصال نجح ولم يُحظر
          ACCEPTED = {200, 301, 302, 400}
          REJECTED = {403, 429}

          # ---------- 3) التحقق ----------
          async def main():
              sem = asyncio.Semaphore(CONCURRENCY)
              valid = []

              async def check(session, proxy):
                  async with sem:
                      try:
                          async with session.get(
                              TEST_URL,
                              proxy=f'http://{proxy}',
                              timeout=aiohttp.ClientTimeout(total=TIMEOUT),
                              allow_redirects=False,
                          ) as resp:
                              status = resp.status
                              # نتجاهل جسم الاستجابة لتصفية أسرع
                              if status in REJECTED:
                                  return None
                              if status in ACCEPTED or status < 500:
                                  return proxy
                              return None
                      except Exception:
                          return None

              connector = aiohttp.TCPConnector(
                  limit=CONCURRENCY,
                  limit_per_host=0,
                  ssl=False,
                  ttl_dns_cache=300,
              )
              headers = {
                  'User-Agent': (
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                      'AppleWebKit/537.36 (KHTML, like Gecko) '
                      'Chrome/122.0.0.0 Safari/537.36'
                  ),
                  'Accept-Language': 'en-US,en;q=0.9',
              }

              async with aiohttp.ClientSession(
                  headers=headers,
                  connector=connector,
              ) as session:
                  tasks = [asyncio.create_task(check(session, p)) for p in proxies]
                  pending = set(tasks)

                  while pending and len(valid) < MAX_VALID:
                      done, pending = await asyncio.wait(
                          pending,
                          return_when=asyncio.FIRST_COMPLETED,
                      )
                      for t in done:
                          try:
                              res = t.result()
                              if res:
                                  valid.append(res)
                          except Exception:
                              pass

                  # إلغاء المهام المتبقية بشكل نظيف
                  for t in pending:
                      t.cancel()
                  await asyncio.gather(*pending, return_exceptions=True)

              return valid

          valid = asyncio.run(main())
          print(f'Valid for Instagram: {len(valid)}')

          # ---------- 4) الحفظ ----------
          with open('instagram_proxies.txt', 'w') as f:
              f.write('\n'.join(sorted(valid)) + ('\n' if valid else ''))

          PY

      - name: Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git pull --rebase origin ${{ github.ref_name }} || true
          git add instagram_proxies.txt
          git commit -m "Auto-update Instagram proxies: $(date -u)" || echo "No changes"
          git push
