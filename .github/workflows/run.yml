name: Run Proxy Updater

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true # للتأكد من توفر صلاحيات الدفع باستخدام GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Download and Save Proxies
        run: |
          python3 -c "
          import urllib.request
          sources = [
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt',
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/https.txt',
              'https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=protocolipport&format=text'
          ]
          proxies = set()
          for src in sources:
              try:
                  req = urllib.request.Request(src, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      for line in resp.read().decode('utf-8').splitlines():
                          c = line.strip()
                          if c and ':' in c:
                              proxies.add(c)
              except Exception as e:
                  print('Skip:', e)
          
          # ترتيب البروكسيات أبجدياً لجعل الملف منظماً وتسهيل مقارنة التغييرات
          sorted_proxies = sorted(list(proxies))
          
          with open('active_proxies.txt', 'w') as f:
              for p in sorted_proxies:
                  f.write(p + '\n')
          print('Total unique proxies:', len(sorted_proxies))
          "

      - name: Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add active_proxies.txt
          
          # التحقق مما إذا كان هناك تغييرات فعلية في الملف قبل الالتزام
          if git diff --staged --quiet; then
            echo "✅ No changes to commit. Proxies list is already up to date."
          else
            echo "🔄 Changes detected. Committing and pushing..."
            git commit -m "Auto-update proxies: $(date -u)"
            git push
          fi
