name: Run Proxy Updater

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: proxy-updater
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install aiohttp

      - name: Download, Validate and Save Proxies
        run: |
          python3 - <<'PY'
          import asyncio, re, urllib.request
          import aiohttp

          # ---------- 1) جمع المصادر ----------
          sources = [
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt',
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/https.txt',
              'https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&protocol=http&proxy_format=ipport&format=text&timeout=5000',
          ]
          pat = re.compile(r'^(\d{1,3}\.){3}\d{1,3}:\d{1,5}$')
          proxies = set()
          for src in sources:
              try:
                  req = urllib.request.Request(src, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = r.read(5 * 1024 * 1024).decode('utf-8', 'ignore')
                      for line in data.splitlines():
                          c = line.strip()
                          if pat.match(c):
                              proxies.add(c)
              except Exception as e:
                  print('Skip:', src, e)

          print(f'Collected: {len(proxies)} proxies')

          # ---------- 2) الإعدادات ----------
          TEST_URL = 'http://httpbin.org/ip'
          TIMEOUT = 8
          CONCURRENCY = 200
          MAX_VALID = 500

          # ---------- 3) التحقق ----------
          async def main():
              sem = asyncio.Semaphore(CONCURRENCY)  # ← داخل الـ loop
              valid = []

              async def check(session, proxy):
                  async with sem:
                      try:
                          async with session.get(
                              TEST_URL,
                              proxy=f'http://{proxy}',
                              timeout=aiohttp.ClientTimeout(total=TIMEOUT),
                          ) as resp:
                              if resp.status == 200:
                                  await resp.read()
                                  return proxy
                      except Exception:
                          return None

              connector = aiohttp.TCPConnector(limit=CONCURRENCY, ssl=False)
              async with aiohttp.ClientSession(
                  headers={'User-Agent': 'Mozilla/5.0'},
                  connector=connector,
              ) as session:
                  tasks = [asyncio.create_task(check(session, p)) for p in proxies]
                  pending = set(tasks)

                  while pending and len(valid) < MAX_VALID:
                      done, pending = await asyncio.wait(
                          pending, return_when=asyncio.FIRST_COMPLETED
                      )
                      for t in done:
                          try:
                              res = t.result()
                              if res:
                                  valid.append(res)
                          except Exception:
                              pass

                  # ← إلغاء المهام المتبقية بشكل نظيف
                  for t in pending:
                      t.cancel()
                  await asyncio.gather(*pending, return_exceptions=True)

              return valid

          valid = asyncio.run(main())
          print(f'Valid: {len(valid)}')

          # ---------- 4) الحفظ ----------
          with open('active_proxies.txt', 'w') as f:
              f.write('\n'.join(sorted(valid)) + '\n')
          PY

      - name: Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git pull --rebase origin ${{ github.ref_name }} || true
          git add active_proxies.txt
          git commit -m "Auto-update proxies: $(date -u)" || echo "No changes"
          git push
