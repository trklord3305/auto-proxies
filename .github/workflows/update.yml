name: Auto Update Free Proxies

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Fresh Proxies
        run: |
          python -c "
          import urllib.request

          sources = [
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt',
              'https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/https.txt',
              'https://api.proxyscrape.com/v4/free-proxy-list/get?proxy_format=text&format=text'
          ]

          proxies = set()
          for src in sources:
              try:
                  req = urllib.request.Request(src, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      lines = response.read().decode('utf-8').splitlines()
                      for line in lines:
                          cleaned = line.strip()
                          if cleaned and ':' in cleaned:
                              proxies.add(cleaned)
                  except Exception as e:
                      print(f'Error fetching from {src}: {e}')

          with open('active_proxies.txt', 'w') as f:
              for p in list(proxies):
                  f.write(f'{p}\n')

          print(f'Total active proxies saved: {len(proxies)}')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add active_proxies.txt
          git commit -m "Auto-update proxies every 5 minutes" || exit 0
          git push
